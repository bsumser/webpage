version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=64MB
        -c maintenance_work_mem=128MB
        -c max_wal_size=2GB
        -c checkpoint_completion_target=0.9
        -c synchronous_commit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio} -c 'SELECT 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-portfolio_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      DB_NAME: ${POSTGRES_DB:-portfolio}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: unless-stopped
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s  # Gives Nginx entrypoint scripts time to complete before failing health

  proxy:
    image: nginx:alpine
    container_name: portfolio_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal_network

volumes:
  pgdata:

networks:
  internal_network:
    driver: bridge